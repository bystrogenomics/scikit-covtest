name: Deploy Sphinx documentation to Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies (Pandoc)
        run: |
          if find . -name "*.ipynb" -not -path "*/.*" | grep -q .; then
            echo "Jupyter notebooks found. Installing pandoc..."
            sudo apt-get update && sudo apt-get install -y pandoc
          else
            echo "No Jupyter notebooks found. Skipping pandoc installation."
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Check for documentation requirements files
          if [ -f docs/requirements.txt ]; then
            pip install -r docs/requirements.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install sphinx sphinx-rtd-theme
          fi

          # If notebooks exist, make sure nbsphinx and ipykernel are installed
          if find . -name "*.ipynb" -not -path "*/.*" | grep -q .; then
            pip install nbsphinx ipykernel
          fi

          # Install the package in editable mode
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            pip install -e .
          fi

      - name: Build HTML
        run: |
          make -C docs html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
