[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scikit-covtest"
version = "0.0.2"
description = "Covariance Hypothesis Testing and Evaluation"
authors = [
    { name = "Austin Talbot", email = "austin.talbot1993@gmail.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "tqdm",
    "cloudpickle",
    "matplotlib",
    "cvxpy",
    "statsmodels",
]

[project.optional-dependencies]
test     = ["pytest", "pytest-cov"]
docs     = ["Sphinx", "sphinx-rtd-theme", "docutils"]
lint     = ["ruff==0.4.4", "black==24.4.2"]
datasets = ["pooch>=1.8"]
dev      = ["pytest", "pytest-cov", "ruff==0.4.4", "black==24.4.2", "pooch>=1.8"]

[project.urls]
Homepage = "https://github.com/bystrogenomics/scikit-covtest"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["covtest*"]

[tool.setuptools.package-data]
# iris is small (7 KB) — keep bundled.
# mnist and tcga are fetched on first use via pooch (see covtest/datasets/loader.py).
"covtest.datasets" = ["data/iris_dataset.npz"]
"covtest.methods" = ["*.p"]

[tool.ruff]
line-length = 80
ignore = ["E501"]

[tool.black]
line-length = 80
